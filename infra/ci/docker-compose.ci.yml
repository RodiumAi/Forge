name: forge-web-ci

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge_web_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge_web_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ci
      MINIO_ROOT_PASSWORD: ci123456
    ports:
      - "9000:9000"
