<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Neon Nights — preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 480px; height: 300px; overflow: hidden;
    background: #16003b; color: #fdf3ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Arial Black", Arial, sans-serif;
    position: relative;
  }
  .nav { position: relative; z-index: 5; display: flex; justify-content: space-between; align-items: center;
    padding: 6px 14px; background: rgba(22,0,59,.82); border-bottom: 1px solid rgba(45,226,230,.25); }
  .brand { font-weight: 900; font-size: 10px; letter-spacing: .14em; color: #ff2975;
    text-shadow: 0 0 8px rgba(255,41,117,.7); }
  .brand b { color: #2de2e6; text-shadow: 0 0 8px rgba(45,226,230,.7); }
  .links { display: flex; gap: 10px; font-size: 7px; font-weight: 700; text-transform: uppercase; color: #a78bca; }
  .btn { border: 1.5px solid #ff2975; color: #fdf3ff; background: rgba(255,41,117,.12);
    font-weight: 800; font-size: 7px; text-transform: uppercase; padding: 3px 9px;
    box-shadow: 0 0 10px rgba(255,41,117,.4); }
  .hero { position: relative; height: 246px; overflow: hidden; }
  .sky { position: absolute; inset: 0 0 30% 0;
    background: linear-gradient(to bottom, #16003b 0%, #43125f 40%, #a12c68 75%, #ff2975 100%); }
  .sun { position: absolute; bottom: 26%; left: 50%; transform: translateX(-50%);
    width: 130px; height: 130px; border-radius: 50%;
    background: linear-gradient(to bottom, #ffd319 0%, #ff901f 35%, #ff2975 70%, #f222ff 100%);
    -webkit-mask: linear-gradient(to bottom, #000 0 55%, transparent 55% 59%, #000 59% 68%, transparent 68% 72%, #000 72% 82%, transparent 82% 86%, #000 86% 100%);
    mask: linear-gradient(to bottom, #000 0 55%, transparent 55% 59%, #000 59% 68%, transparent 68% 72%, #000 72% 82%, transparent 82% 86%, #000 86% 100%);
    box-shadow: 0 0 50px rgba(255,41,117,.7); }
  .floor { position: absolute; left: -15%; right: -15%; bottom: 0; height: 30%;
    background: #0d0026; border-top: 1.5px solid #2de2e6;
    box-shadow: 0 -2px 18px rgba(45,226,230,.5); overflow: hidden; perspective: 120px; }
  .grid { position: absolute; inset: -100% -30% 0;
    background:
      repeating-linear-gradient(to right, rgba(45,226,230,.65) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(to bottom, rgba(45,226,230,.65) 0 1px, transparent 1px 24px);
    transform: rotateX(62deg); transform-origin: top center; }
  .content { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding-bottom: 34px; }
  .eyebrow { font-size: 6.5px; font-weight: 800; letter-spacing: .5em; color: #2de2e6;
    text-shadow: 0 0 6px rgba(45,226,230,.8); margin-bottom: 5px; }
  h1 { font-size: 34px; font-weight: 900; line-height: .92; letter-spacing: .04em;
    text-shadow: 0 0 6px rgba(255,41,117,.9), 0 0 20px rgba(255,41,117,.6), 2px 2px 0 rgba(45,226,230,.55); }
  .sub { font-size: 7.5px; color: #a78bca; max-width: 250px; margin: 7px 0 9px; }
  .cta { display: flex; gap: 8px; }
  .btn2 { border: 1.5px solid #2de2e6; color: #fdf3ff; background: rgba(45,226,230,.1);
    font-weight: 800; font-size: 7px; text-transform: uppercase; padding: 4px 11px;
    box-shadow: 0 0 10px rgba(45,226,230,.35); }
  .btn3 { border: 1.5px solid #ff2975; color: #fdf3ff; background: rgba(255,41,117,.12);
    font-weight: 800; font-size: 7px; text-transform: uppercase; padding: 4px 11px;
    box-shadow: 0 0 10px rgba(255,41,117,.4); }
  .albums { position: absolute; z-index: 4; bottom: 8px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px; }
  .album { width: 74px; }
  .cover { position: relative; border: 1.5px solid rgba(45,226,230,.4); overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,.6), 0 0 12px rgba(255,41,117,.25); }
  .cover img { width: 100%; height: 44px; object-fit: cover; display: block;
    filter: saturate(1.3) contrast(1.05); }
  .album p { font-size: 6px; font-weight: 900; letter-spacing: .06em; margin-top: 3px; text-align: center; }
</style>
</head>
<body>
  <div class="nav">
    <span class="brand">NEON<b>NIGHTS</b></span>
    <span class="links"><span>Music</span><span>Tracklist</span><span>Tour</span><span>About</span></span>
    <span class="btn">▶ Listen now</span>
  </div>
  <div class="hero">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="floor"><div class="grid"></div></div>
    <div class="content">
      <p class="eyebrow">NEW ALBUM · OUT NOW</p>
      <h1>MIDNIGHT<br />ARCADE</h1>
      <p class="sub">Synthwave from the year that never was. 11 tracks of chrome, rain and slow-motion heartbreak.</p>
      <div class="cta"><span class="btn3">▶ Play the album</span><span class="btn2">See tour dates</span></div>
    </div>
    <div class="albums">
      <div class="album"><div class="cover"><img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1200&q=70" alt="Midnight Arcade" /></div><p>MIDNIGHT ARCADE</p></div>
      <div class="album"><div class="cover"><img src="https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=1200&q=70" alt="Ghost Highway" /></div><p>GHOST HIGHWAY</p></div>
      <div class="album"><div class="cover"><img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1200&q=70" alt="VHS Dreams" /></div><p>VHS DREAMS</p></div>
    </div>
  </div>
</body>
</html>
