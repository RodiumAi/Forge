<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>tailnext-saas preview</title>
<style>
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:#fff;color:#1e293b}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
  .brand{color:#4f46e5;font-weight:700;font-size:13px}
  .cta{background:#4f46e5;color:#fff;border-radius:6px;padding:4px 10px;font-size:10px;font-weight:600}
  .hero{display:flex;gap:14px;padding:10px 16px;align-items:center}
  h1{font-size:16px;margin:0 0 6px}
  .lead{font-size:9px;color:#64748b;margin:0 0 8px}
  .vis{background:#eef2ff;border-radius:10px;padding:10px;flex:0 0 42%}
  .chart{display:flex;align-items:flex-end;gap:4px;height:52px}
  .chart span{flex:1;background:#4f46e5;border-radius:3px 3px 0 0}
  .feat{display:flex;gap:8px;padding:12px 16px}
  .card{flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:8px;font-size:8px;color:#64748b}
  .card b{display:block;color:#1e293b;font-size:9px;margin-bottom:2px}
</style>
</head>
<body>
  <div class="bar"><span class="brand">Pulsedeck</span><span class="cta">Get started</span></div>
  <div class="hero">
    <div>
      <h1>Ship updates users notice</h1>
      <p class="lead">Announcements, rollouts and adoption in one calm dashboard.</p>
      <span class="cta">Start free trial</span>
    </div>
    <div class="vis"><div class="chart">
      <span style="height:30%"></span><span style="height:55%"></span><span style="height:42%"></span>
      <span style="height:78%"></span><span style="height:64%"></span><span style="height:92%"></span>
    </div></div>
  </div>
  <div class="feat">
    <div class="card"><b>Instant changelogs</b>Release notes from PRs.</div>
    <div class="card"><b>Guided rollouts</b>Ship to 1%, then widen.</div>
    <div class="card"><b>Adoption analytics</b>See usage within hours.</div>
  </div>
</body>
</html>
