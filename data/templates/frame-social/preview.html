<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Frame — preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 480px; height: 300px; overflow: hidden;
    background: radial-gradient(120% 120% at 15% 0%, #26262e, #17171c 62%);
    color: #101114;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: center; gap: 20px; padding: 0 26px;
  }
  .side { width: 150px; }
  .side .logo {
    font-size: 20px; font-weight: 800; letter-spacing: -.03em;
    background: linear-gradient(135deg, #f9a8d4, #8b5cf6 45%, #60a5fa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .side h2 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.14; margin-top: 12px; color: #f5f5f7; }
  .side p { font-size: 10px; color: #a1a1ab; line-height: 1.45; margin-top: 8px; }
  .side .tag {
    display: inline-block; margin-top: 12px; font-size: 8.5px; font-weight: 700; color: #c4b5fd;
    background: rgba(139,92,246,.2); padding: 3px 8px; border-radius: 99px;
  }
  .phone {
    width: 172px; height: 288px; border-radius: 26px; flex: none;
    border: 2px solid rgba(255,255,255,.16);
    background: #fbfbfd; overflow: hidden; position: relative;
    box-shadow: 0 22px 48px rgba(0,0,0,.55);
  }
  .notch { width: 52px; height: 7px; border-radius: 99px; margin: 8px auto 0; background: rgba(16,17,20,.14); }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px 8px; border-bottom: 1px solid rgba(16,17,20,.09); }
  .nav .wm { font-size: 15px; font-weight: 800; letter-spacing: -.03em; background: linear-gradient(135deg, #f9a8d4, #8b5cf6 45%, #60a5fa); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nav .msg { width: 13px; height: 13px; border-radius: 4px; border: 1.4px solid rgba(16,17,20,.4); }
  .stories { display: flex; gap: 7px; padding: 8px 10px 7px; }
  .st { text-align: center; }
  .ring { width: 30px; height: 30px; border-radius: 99px; padding: 2px; background: linear-gradient(135deg, #f9a8d4, #8b5cf6 45%, #60a5fa); position: relative; }
  .ring.me { background: rgba(16,17,20,.16); }
  .ring i { display: block; width: 100%; height: 100%; border-radius: 99px; border: 2px solid #fbfbfd; overflow: hidden; background: #ede9fe; }
  .ring i img { width: 100%; height: 100%; object-fit: cover; }
  .ring .add { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 99px; background: #8b5cf6; color: #fff; border: 1.5px solid #fbfbfd; font-size: 8px; line-height: 9px; font-weight: 800; }
  .st span { display: block; font-size: 5.5px; color: #101114; margin-top: 3px; }
  .post .ph { display: flex; align-items: center; gap: 5px; padding: 5px 11px; }
  .post .ph .av { width: 17px; height: 17px; border-radius: 99px; padding: 1.3px; background: linear-gradient(135deg, #f9a8d4, #8b5cf6); }
  .post .ph .av span { display: block; width: 100%; height: 100%; border-radius: 99px; border: 1.4px solid #fbfbfd; overflow: hidden; }
  .post .ph .av img { width: 100%; height: 100%; object-fit: cover; }
  .post .ph b { font-size: 7px; }
  .post .ph small { display: block; font-size: 5px; color: #6b7280; }
  .post .ph .t { margin-left: auto; font-size: 5.5px; color: #6b7280; }
  .post .img { height: 78px; background: linear-gradient(135deg, #fce7f3, #fbcfe8); overflow: hidden; }
  .post .img img { width: 100%; height: 100%; object-fit: cover; }
  .post .acts { display: flex; align-items: center; gap: 6px; padding: 6px 11px 2px; }
  .post .acts .a { width: 12px; height: 12px; }
  .post .acts .heart { color: #ef4444; }
  .post .acts .bk { margin-left: auto; }
  .post .cap { padding: 0 11px; }
  .post .cap .lk { font-size: 6.5px; font-weight: 800; }
  .post .cap .c { font-size: 6px; color: #101114; margin-top: 1px; }
  .post .cap .c b { font-weight: 700; }
  .tabs {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(4,1fr); padding: 6px 4px 8px;
    border-top: 1px solid rgba(16,17,20,.1);
    background: rgba(251,251,253,.94);
    font-size: 5.5px; color: #6b7280; text-align: center; gap: 2px;
  }
  .tabs .dot { width: 12px; height: 12px; margin: 0 auto 2px; border-radius: 3px; border: 1.3px solid currentColor; }
  .tabs .active { color: #8b5cf6; font-weight: 700; }
</style>
</head>
<body>
  <div class="side">
    <div class="logo">Frame</div>
    <h2>Share the moment</h2>
    <p>Onboarding · stories &amp; photo feed · explore · profile — with bottom tabs.</p>
    <span class="tag">Mobile app shell</span>
  </div>
  <div class="phone">
    <div class="notch"></div>
    <div class="nav"><span class="wm">Frame</span><span class="msg"></span></div>
    <div class="stories">
      <div class="st"><span class="ring me"><i><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=70" alt="" /></i><span class="add">+</span></span><span>Your story</span></div>
      <div class="st"><span class="ring"><i><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=120&q=70" alt="" /></i></span><span>maya</span></div>
      <div class="st"><span class="ring"><i><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=120&q=70" alt="" /></i></span><span>noor</span></div>
      <div class="st"><span class="ring"><i><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=70" alt="" /></i></span><span>leo</span></div>
    </div>
    <div class="post">
      <div class="ph">
        <span class="av"><span><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=96&q=70" alt="" /></span></span>
        <div><b>maya.k</b><small>Marrakech</small></div>
        <span class="t">2h</span>
      </div>
      <div class="img"><img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=400&q=70" alt="" /></div>
      <div class="acts">
        <svg class="a heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.35-7-9.3A3.7 3.7 0 0 1 12 8.2 3.7 3.7 0 0 1 19 10.7c0 4.95-7 9.3-7 9.3Z"/></svg>
        <svg class="a" viewBox="0 0 24 24" fill="none" stroke="#101114" stroke-width="1.8"><path d="M4 12a7 7 0 0 1 7-7h2a7 7 0 0 1 0 14H8l-4 3v-4.2A7 7 0 0 1 4 12Z" stroke-linejoin="round"/></svg>
        <svg class="a" viewBox="0 0 24 24" fill="none" stroke="#101114" stroke-width="1.8"><path d="M5 12v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6M12 15V4M8 8l4-4 4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="a bk" viewBox="0 0 24 24" fill="none" stroke="#101114" stroke-width="1.8"><path d="M6 4h12v16l-6-4-6 4V4Z" stroke-linejoin="round"/></svg>
      </div>
      <div class="cap">
        <div class="lk">1,204 likes</div>
        <div class="c"><b>maya.k</b> Sunday plates, slow morning 🍑</div>
      </div>
    </div>
    <div class="tabs">
      <span class="active"><span class="dot"></span>Feed</span>
      <span><span class="dot"></span>Explore</span>
      <span><span class="dot"></span>Create</span>
      <span><span class="dot"></span>Profile</span>
    </div>
  </div>
</body>
</html>
