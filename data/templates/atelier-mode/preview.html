<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Atelier Mode preview</title>
<style>
  :root{--bg:#f8f6f2;--fg:#141210;--muted:#8a8177;--accent:#9a7b4f;--line:#e4dfd6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:Georgia,serif;padding:14px}
  .bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .nav{display:flex;gap:10px;font-size:8px;letter-spacing:.16em;text-transform:uppercase;font-family:"Segoe UI",sans-serif}
  .brand{font-size:11px;letter-spacing:.4em}
  .cart{font-size:8px;letter-spacing:.14em;text-transform:uppercase;font-family:"Segoe UI",sans-serif}
  .hero{position:relative;height:130px;overflow:hidden;margin-bottom:12px}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,18,16,.55),transparent 60%)}
  .hero-t{position:absolute;left:12px;bottom:10px;color:#f8f6f2}
  .kick{font-size:7px;letter-spacing:.3em;text-transform:uppercase;color:#d8bd93;margin-bottom:3px;font-family:"Segoe UI",sans-serif}
  h1{font-size:16px;font-weight:400;letter-spacing:.06em}
  .hero-t p{font-size:8px;font-family:"Segoe UI",sans-serif;color:rgba(248,246,242,.85);margin-top:2px}
  .row{display:flex;gap:10px}
  .prod{flex:1}
  .prod img{width:100%;height:78px;object-fit:cover;display:block}
  .prod h3{font-size:9px;font-weight:400;letter-spacing:.1em;margin-top:5px;text-align:center}
  .price{font-size:8px;color:var(--accent);letter-spacing:.12em;text-align:center;font-family:"Segoe UI",sans-serif}
</style>
</head>
<body>
  <div class="bar">
    <span class="nav"><span>Collection</span><span>Lookbook</span><span>Maison</span></span>
    <span class="brand">MAISON VERNET</span>
    <span class="cart">Cart (0)</span>
  </div>
  <div class="hero">
    <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=400&q=70" alt="">
    <div class="veil"></div>
    <div class="hero-t">
      <div class="kick">Automne — Hiver 2026</div>
      <h1>La Ligne Silencieuse</h1>
      <p>Twenty-two looks cut in ivory, ink and bronze.</p>
    </div>
  </div>
  <div class="row">
    <div class="prod"><img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=300&q=70" alt=""><h3>Le Trench Vernet</h3><div class="price">€2,450</div></div>
    <div class="prod"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=300&q=70" alt=""><h3>Robe Méridienne</h3><div class="price">€1,780</div></div>
    <div class="prod"><img src="https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=300&q=70" alt=""><h3>Veste Atelier</h3><div class="price">€1,960</div></div>
  </div>
</body>
</html>
