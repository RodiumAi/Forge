name: Integration proposal
description: Propose a new embed integration for the catalog. See docs/INTEGRATIONS.md. (Français accepté / French is welcome)
labels: ["integration"]
body:
  - type: input
    id: name
    attributes:
      label: Integration name and id
      description: "Proposed id must match ^[a-z0-9][a-z0-9-]{1,62}$"
      placeholder: "tally: Tally"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Primary category
      options:
        - forms
        - booking
        - chat
        - payments
        - data
        - email
        - maps
        - media
        - comments
        - analytics
        - widgets
      default: 0
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Official embed docs URL
      placeholder: "https://…"
    validations:
      required: true
  - type: dropdown
    id: methods
    attributes:
      label: Embed methods
      description: The catalog only accepts drop-in embeds that work on a static site by paste.
      multiple: true
      options:
        - iframe
        - script
        - link
    validations:
      required: true
  - type: checkboxes
    id: dropin
    attributes:
      label: Drop-in only
      options:
        - label: It works by pasting an iframe, a script tag or a link, with no server code, SDK or secret (auth/BaaS SDKs and partial form-action APIs are out of scope).
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Caveats for Forge (static sites)
      description: CSP, sandbox, cookies, limits on the vendor side…
