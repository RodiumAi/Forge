name: Bug report
description: Something is broken. (Français accepté / French is welcome)
labels: ["bug"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Project kind
      description: Which kind of project shows the bug?
      options:
        - Site / App
        - Slides
        - Codelab
        - Design system
        - Not specific
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to…
        2. Click…
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Docker (docker compose up)
        - Local (host API/web)
        - Mixed (Docker services + host API)
        - Forge Cloud (forge.rodiumai.io)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output (docker compose logs, browser console, pytest…). Will be formatted as code. Remove any key, token or personal data first.
      render: shell
