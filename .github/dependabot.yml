version: 2

# Grouped, monthly updates. Weekly per-dependency PRs on a repo this size buries
# maintainers and trains everyone to rubber-stamp — grouping keeps the signal.
# Security advisories are delivered separately by GitHub and are not throttled
# by this schedule.
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/api/runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      runtime-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
