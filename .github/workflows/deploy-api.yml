# Deploy Forge API (maintainers). Frontend: Amplify auto-deploys apps/web.

name: Deploy API

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: forge/api
  ECS_CLUSTER: rodiumai-cluster
  ECS_SERVICE: forge-api
  ECS_TASK_DEFINITION: forge-api
  CONTAINER_NAME: api

jobs:
  changes:
    name: Detect API deployment changes
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check changed paths
        id: filter
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null)"; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" \
            | grep -Eq '^(apps/api/|data/templates/|data/integrations/|\.github/workflows/(ci|deploy-api)\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Pre-deploy checks (API)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      TEMPLATES_ROOT: ${{ github.workspace }}/data/templates
      INTEGRATIONS_ROOT: ${{ github.workspace }}/data/integrations
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip check

      - name: Install runtime CLI (smoke transform tests)
        working-directory: apps/api/runtime
        run: npm ci

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Import the app
        env:
          ENVIRONMENT: test
        run: python -c "import app.main as m; print(f'{len(m.app.routes)} routes')"

      - name: Unit tests
        env:
          ENVIRONMENT: test
        run: pytest -q

  build-and-push:
    name: Build image → ECR
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build API image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --platform linux/amd64 \
            -f apps/api/Dockerfile \
            -t "${IMAGE}" \
            .
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Generate CycloneDX SBOM
        run: |
          docker run --rm \
            -v trivy-cache:/root/.cache/trivy \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.74.0 \
            image --format cyclonedx \
            --output /work/forge-api-sbom.cdx.json \
            "${IMAGE}"

      - name: Generate full vulnerability report
        run: |
          docker run --rm \
            -v trivy-cache:/root/.cache/trivy \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.74.0 \
            image --scanners vuln --format json \
            --output /work/forge-api-trivy.json \
            "${IMAGE}"

      - name: Upload API security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-api-security-${{ github.event.workflow_run.head_sha }}
          path: |
            forge-api-sbom.cdx.json
            forge-api-trivy.json
          if-no-files-found: error
          retention-days: 90

      - name: Scan built image for fixable vulnerabilities
        run: |
          docker run --rm \
            -v trivy-cache:/root/.cache/trivy \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 \
            image --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "${IMAGE}"

      - name: Verify non-root runtime and Chromium
        run: |
          docker run --rm --entrypoint sh "${IMAGE}" -c \
            'test "$(id -u)" != "0" && touch /data/projects/.non-root-smoke'
          docker run --rm --entrypoint python "${IMAGE}" -c \
            'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); b.close(); p.stop()'

      - name: Push verified API image
        run: |
          set +e
          PUSH_OUTPUT="$(docker push "${IMAGE}" 2>&1)"
          PUSH_STATUS=$?
          set -e
          printf '%s\n' "${PUSH_OUTPUT}"
          if [ "${PUSH_STATUS}" -eq 0 ]; then
            exit 0
          elif [[ "${PUSH_OUTPUT}" == *"tag invalid"* \
            && "${PUSH_OUTPUT}" == *"already exists"* \
            && "${PUSH_OUTPUT}" == *"immutable"* ]]; then
            echo "Reusing immutable image ${IMAGE}"
          else
            exit "${PUSH_STATUS}"
          fi

  deploy:
    name: Deploy to ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: Download ECS task definition
        env:
          ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION || env.ECS_TASK_DEFINITION }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition image only
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.CONTAINER_NAME || env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE || env.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER || env.ECS_CLUSTER }}
          wait-for-service-stability: true
