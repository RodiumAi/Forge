# AWS Amplify Hosting — monorepo (app root: apps/web)
# Set AMPLIFY_MONOREPO_APP_ROOT=apps/web in the Amplify console (branch main).

version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
          - node_modules/**/*
